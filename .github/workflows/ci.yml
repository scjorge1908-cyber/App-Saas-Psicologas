name: CI

# Roda a cada envio de código e em pull requests:
#  1. Banco: migrations + 159 asserções SQL + teste de backup/restauração (Postgres 16)
#  2. App: tipos, testes unitários (inclui PDFs) e build de produção
#  3. Integração (supabase-js real) e E2E (Playwright, celular + desktop) contra
#     o gateway local + Postgres com as migrations reais
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PGHOST: 127.0.0.1
  PGUSER: postgres
  PGPASSWORD: postgres

jobs:
  banco:
    name: Banco (SQL + backup)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Cliente PostgreSQL 16
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - name: Testes SQL (isolamento, agenda, confirmação, prontuário, financeiro, segurança)
        env:
          PSQL: psql
        run: scripts/db-test.sh psi_ci
      - name: Backup e restauração
        env:
          PSQL: psql
          PGDUMP: pg_dump
          PGRESTORE: pg_restore
        run: scripts/test-backup-restore.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias-banco
          path: docs/evidencias/*.log

  app:
    name: App (tipos, unitários, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: sudo apt-get install -y -qq poppler-utils
      - run: npm ci
      - run: npx tsc -b
      - run: npx vitest run
      - name: Build
        env:
          VITE_SUPABASE_URL: https://exemplo.supabase.co
          VITE_SUPABASE_ANON_KEY: build-check
        run: npm run build

  e2e:
    name: Integração e E2E
    runs-on: ubuntu-24.04
    needs: [banco, app]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            dev-gateway/package-lock.json
      - name: Cliente PostgreSQL 16
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16
      - name: Dependências
        run: |
          (cd web && npm ci)
          (cd dev-gateway && npm ci)
          (cd web && npx playwright install --with-deps chromium)
      - name: Banco de teste + gateway + app
        env:
          PSQL: psql
        run: |
          scripts/e2e-db.sh psi_e2e
          nohup node dev-gateway/server.mjs > gateway.log 2>&1 &
          cd web
          printf 'VITE_SUPABASE_URL=http://localhost:54321\nVITE_SUPABASE_ANON_KEY=dev-anon-key\n' > .env.development.local
          nohup npx vite --port 5173 > ../vite.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:54321/__health && curl -sf -o /dev/null http://127.0.0.1:5173/ && break; sleep 1; done
      - name: Integração (supabase-js)
        working-directory: web
        run: npx vitest run --config vitest.integration.config.ts
      - name: E2E (celular + desktop)
        working-directory: web
        run: |
          mkdir -p ../docs/evidencias/telas
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias-e2e
          path: |
            web/playwright-report
            web/test-results
            docs/evidencias/telas
            gateway.log
            vite.log
