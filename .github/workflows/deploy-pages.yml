name: Publicar (GitHub Pages)

# Publica o app web depois que o CI passa na main.
# Requer as variáveis do repositório (Settings → Secrets and variables → Actions → Variables):
#   VITE_SUPABASE_URL       URL do projeto Supabase
#   VITE_SUPABASE_ANON_KEY  chave PÚBLICA (anon/publishable) — nunca a service_role
# Enquanto não estiverem definidas, a publicação é pulada.
# Observação: os termos do GitHub Pages não permitem operar um SaaS comercial;
# use este endereço como ambiente de teste e migre para Cloudflare Pages no lançamento.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ vars.VITE_SUPABASE_URL != '' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_PUBLIC_APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          npm run build
          cp dist/index.html dist/404.html   # rotas da SPA (ex.: link /c/<token>)
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
